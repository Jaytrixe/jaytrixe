<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaytrixe | Portfolio</title>
  <style>
    /* --- DESIGN SYSTEM THEME VARIABLES --- */
    :root {
      --background: #0b1012;
      --surface: #11191c;
      --border: #1f2d31;
      --text: #e2e8e7;
      --muted: #8ba3a1;
      --accent: #55f2c2;
      --accent-dim: rgba(85, 242, 194, 0.1);
      --content-width: 1100px;
      --radius: 12px;
    }

    /* --- GLOBAL LAYOUT & STYLING --- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5rem;
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 75% 0%, rgba(38, 111, 94, 0.14), transparent 38rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
      border-radius: 4px;
    }

    .skip-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      padding: 0.7rem 1rem;
      transform: translateY(-160%);
      background: var(--accent);
      color: #07110e;
      border-radius: 8px;
      font-weight: 700;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .container {
      width: min(var(--content-width), calc(100% - 3rem));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 16, 18, 0.84);
      backdrop-filter: blur(16px);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .logo-mark {
      width: 12px;
      height: 12px;
      display: inline-block;
      background: var(--accent);
      border-radius: 4px 4px 4px 1px;
      box-shadow: 0 0 20px rgba(85, 242, 194, 0.45);
      transform: rotate(-12deg);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 3vw, 2rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.9rem;
      transition: color 180ms ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    main section {
      padding-block: clamp(4.5rem, 10vw, 7.5rem);
    }

    .hero {
      min-height: min(760px, calc(100svh - 72px));
      display: grid;
      align-content: center;
      padding-block: 7rem;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0 0 1.5rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(85, 242, 194, 0.7);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 850px;
      margin-bottom: 1.5rem;
      font-size: clamp(3.3rem, 9vw, 7.2rem);
      font-weight: 750;
      letter-spacing: -0.075em;
      line-height: 0.98;
    }

    .accent-text {
      color: var(--accent);
    }

    .hero-copy {
      max-width: 590px;
      margin-bottom: 2rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.2rem);
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.75rem 1.2rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #07110e;
      font-size: 0.92rem;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(85, 242, 194, 0.18);
    }

    .button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .section-heading {
      margin-bottom: 2.25rem;
    }

    .section-kicker {
      margin-bottom: 0.65rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h2 {
      margin-bottom: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 1.1;
    }

    .section-intro {
      max-width: 560px;
      margin: 0.9rem 0 0;
      color: var(--muted);
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .skill {
      padding: 0.65rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: #d7e3e1;
      font-size: 0.9rem;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease;
    }

    .skill:hover {
      border-color: rgba(85, 242, 194, 0.45);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .project-card {
      display: flex;
      min-height: 280px;
      flex-direction: column;
      padding: clamp(1.35rem, 3vw, 2rem);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(23, 34, 38, 0.92), rgba(17, 25, 28, 0.92));
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .project-card:hover {
      transform: translateY(-6px);
      border-color: rgba(85, 242, 194, 0.4);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
    }

    .project-number {
      margin-bottom: 1.6rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .project-card h3 {
      margin-bottom: 0.7rem;
      font-size: 1.35rem;
      letter-spacing: -0.035em;
    }

    .project-card p {
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .project-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 0.45rem;
      margin-top: auto;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .project-link span {
      transition: transform 180ms ease;
    }

    .project-link:hover span {
      transform: translate(3px, -3px);
    }

    .contact {
      padding-block: clamp(4rem, 9vw, 6rem);
      border-top: 1px solid var(--border);
      background: rgba(17, 25, 28, 0.55);
      text-align: center;
    }

    .contact h2 {
      margin-bottom: 1rem;
    }

    .contact-copy {
      max-width: 500px;
      margin: 0 auto 1.5rem;
      color: var(--muted);
    }

    .email-link {
      color: var(--accent);
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .email-link:hover,
    .social-links a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .social-links a {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .site-footer {
      padding-block: 1.25rem;
      color: #778887;
      font-size: 0.8rem;
      text-align: center;
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 2rem, var(--content-width));
      }

      .navbar {
        min-height: 66px;
        gap: 1rem;
      }

      .nav-links {
        gap: 0.85rem;
      }

      .nav-links a {
        font-size: 0.8rem;
      }

      .hero {
        min-height: auto;
        padding-block: 6rem 5rem;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .project-card {
        min-height: 250px;
      }
    }

    @media (max-width: 390px) {
      .navbar {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 0.45rem;
        padding-block: 0.75rem;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <a href="#skills" class="skip-link">Skip to main content</a>

  <!-- Header & Navigation Menu -->
  <header class="site-header">
    <div class="container navbar">
      <div class="logo">
        <span class="logo-mark"></span>
        <span>Jaytrixe.io</span>
      </div>
      <ul class="nav-links">
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Work</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="container hero">
      <div class="eyebrow">
        <span class="status-dot"></span> Available for new opportunities
      </div>
